<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}CampusCanteen{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header class="navbar"><a class="brand" href="{{ url_for('home') }}"><span class="brand-icon">✦</span> CampusCanteen</a>
<nav><a href="{{ url_for('home') }}">Home</a><a href="{{ url_for('menu') }}">Menu</a><a href="{{ url_for('order') }}">Order</a><a href="{{ url_for('admin') }}">Admin</a></nav></header>
<main class="container">{% with messages=get_flashed_messages(with_categories=true) %}{% if messages %}{% for category,message in messages %}<div class="notice {{ category }}">{{ message }}</div>{% endfor %}{% endif %}{% endwith %}{% block content %}{% endblock %}</main>
<footer>Campus Canteen Management System <span>•</span> DBMS Mini Project</footer></body></html>
